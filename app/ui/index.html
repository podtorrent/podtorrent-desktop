<!doctype html>
<html lang="en" data-resolved-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PodTorrent</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/shell.css">
<link rel="stylesheet" href="css/views.css">
<script>
  // resolve the theme before first paint (no flash)
  try {
    const s = JSON.parse(localStorage.getItem("pt.settings") || "{}");
    const t = s.theme || "system";
    document.documentElement.dataset.resolvedTheme = t === "system" ? (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark") : t;
    if (s.reduceEffects) document.documentElement.classList.add("reduce-effects");
    if (window.__TAURI__) document.documentElement.classList.add("tauri");
  } catch {}
</script>
</head>
<body>
<div id="app">
  <div class="shell"><aside class="sidebar"></aside><main class="content"><header class="toolbar"></header></main></div>
</div>
<script type="module" src="js/main.js"></script>
</body>
</html>
