[project]
name = "podtorrent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.14.3",
    "cryptography>=50.0.2",
    "grpcio>=1.84.0",
    "grpcio-tools>=1.84.0",
    "huggingface-hub>=1.33.0",
    "mlx>=0.32.3",
    "mlx-lm>=0.32.0",
    "numpy>=2.5.3",
]

[project.scripts]
podtorrent = "podtorrent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
