[project]
name = "podtorrent"
version = "0.1.21"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.14.3",
    "aioquic>=1.3.0",
    "certifi>=2026.7.22",
    "cryptography>=50.0.2",
    "huggingface-hub>=1.33.0",
    # Apple Silicon runs MLX; everything else runs PyTorch on the same weights (podtorrent/backend.py).
    "mlx>=0.32.3; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "mlx-lm>=0.32.0; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "torch>=2.8; sys_platform != 'darwin' or platform_machine != 'arm64'",
    "safetensors>=0.5; sys_platform != 'darwin' or platform_machine != 'arm64'",
    "transformers>=5.0; sys_platform != 'darwin' or platform_machine != 'arm64'",
    "psutil>=6.0; sys_platform != 'darwin' or platform_machine != 'arm64'",
    "numpy>=2.5.3",
    "protobuf>=7.36.2",
]

[project.scripts]
podtorrent = "podtorrent.cli:main"

[project.optional-dependencies]
# PyTorch on Apple Silicon too, for parity tests (PODTORRENT_BACKEND=torch).
torch = [
    "psutil>=6.0",
    "safetensors>=0.5",
    "torch>=2.8",
    "transformers>=5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "grpcio-tools>=1.84.0",
]

# CUDA 12.8 builds of PyTorch on Windows and Linux: the first that support RTX 50-series (Blackwell).
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }]
