# Build the Linux AppImage and .deb on Ubuntu 22.04, so they run on 22.04 and newer (glibc).
name: Linux build

on:
  push:
    branches: [main]
    tags: ['v*']
    # The app doesn't change with the downloads site or docs. Tag pushes always build (GitHub skips path filters for tags).
    paths-ignore: ['downloads/**', 'docs/**']
  pull_request:
    paths-ignore: ['downloads/**', 'docs/**']
  workflow_dispatch:

concurrency:
  group: linux-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      # A package mirror that stops answering used to hang this step until the 6-hour job limit.
      # Give up on a slow mirror after 30 s, retry, and cap the step.
      - timeout-minutes: 10
        run: |
          apt="sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o DPkg::Lock::Timeout=120"
          $apt update
          $apt install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri

      # uv is bundled into the app; it installs Python and CUDA PyTorch on first launch.
      - uses: astral-sh/setup-uv@v6

      - run: npm ci

      # Not `npm run build`: that bumps the version in tauri.conf.json, which CI shouldn't do.
      - run: node scripts/bundle-backend.js

      - run: npx tauri build --bundles appimage,deb

      # Don't let a full artifact quota stop the build, or the R2 publish below on a tag.
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: podtorrent-linux
          path: |
            app/src-tauri/target/release/bundle/appimage/*.AppImage
            app/src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error

      # On a v* tag, upload the AppImage to R2 and make it the latest at podtorrent.com/download/linux.
      - if: startsWith(github.ref, 'refs/tags/v')
        working-directory: downloads
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npm ci
          node scripts/publish.js linux ../app/src-tauri/target/release/bundle/appimage/*.AppImage
