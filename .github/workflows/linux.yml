# Build the Linux AppImage and .deb on Ubuntu 22.04, so they run on 22.04 and newer (glibc).
name: Linux build

on:
  push:
    branches: [main]
    tags: ['v*']
    # Build only when something that goes into the installer changes, or this workflow itself: not for the
    # release/ publishing, docs, tests, iOS, the rendezvous, or another platform's workflow.
    # Tag pushes always build (GitHub skips path filters for tags).
    paths: ['app/**', 'podtorrent/**', 'pyproject.toml', 'uv.lock', '.python-version', 'install/**', '.github/workflows/linux.yml']
  pull_request:
    paths: ['app/**', 'podtorrent/**', 'pyproject.toml', 'uv.lock', '.python-version', 'install/**', '.github/workflows/linux.yml']
  # A manual run with "publish" ticked uploads the build like a tag does: for a release whose tag build
  # failed, or when the artifact quota is full and there is nothing to download and publish by hand.
  workflow_dispatch:
    inputs:
      publish:
        description: Publish this build to the download page
        type: boolean
        default: false

concurrency:
  group: linux-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      # The runner's DNS has at times failed to resolve the Ubuntu package mirrors, which left this step
      # retrying until the 6-hour job limit. If it can't resolve them, use public resolvers for this job;
      # apt also gives up on a slow mirror after 30 s, and the step is capped.
      - timeout-minutes: 10
        run: |
          if ! getent hosts azure.archive.ubuntu.com archive.ubuntu.com >/dev/null; then
            echo "::warning::The runner's DNS can't resolve the Ubuntu mirrors; using public resolvers"
            sudo resolvectl dns "$(ip -o route get 1.1.1.1 | sed -n 's/.* dev \([^ ]*\).*/\1/p')" 1.1.1.1 8.8.8.8
            sudo resolvectl flush-caches
            getent hosts azure.archive.ubuntu.com archive.ubuntu.com
          fi
          apt="sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o DPkg::Lock::Timeout=120"
          $apt update
          $apt install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri

      # uv is bundled into the app; it installs Python and CUDA PyTorch on first launch.
      - uses: astral-sh/setup-uv@v6

      - run: npm ci

      # The network agent the app bundles (bundle-backend.js stages PODTORRENT_AGENT_BIN): the latest
      # released one, or the one in the repo variable PODTORRENT_AGENT_VERSION (e.g. v0.5.0). Without it the
      # app runs swarm-only and its Network page says "Agent missing".
      - name: Download podtorrent-agent
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ vars.PODTORRENT_AGENT_VERSION }}"
          gh release download $tag -R podtorrent/podtorrent-agent -p 'podtorrent-agent-v*-linux-amd64' -p SHA256SUMS -D agent
          (cd agent && sha256sum -c --ignore-missing SHA256SUMS)
          echo "PODTORRENT_AGENT_BIN=$(ls "$PWD"/agent/podtorrent-agent-v*-linux-amd64)" >> "$GITHUB_ENV"

      # The servers official builds talk to (podtorrent/endpoints.py), from the PODTORRENT_ENDPOINTS secret.
      # A fork sets its own, or builds without servers; a release tag must have one.
      - name: Write endpoints.json
        shell: bash
        env:
          ENDPOINTS: ${{ secrets.PODTORRENT_ENDPOINTS }}
        run: |
          if [ -n "$ENDPOINTS" ]; then printf '%s' "$ENDPOINTS" > "$GITHUB_WORKSPACE/podtorrent/endpoints.json"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then echo "::error::the PODTORRENT_ENDPOINTS secret is not set"; exit 1
          else echo "::warning::no PODTORRENT_ENDPOINTS secret: this build has no servers"; fi

      # Not `npm run build`: that bumps the version in tauri.conf.json, which CI shouldn't do.
      - run: node scripts/bundle-backend.js

      - run: npx tauri build --bundles appimage,deb

      # Don't let a full artifact quota stop the build, or the R2 publish below on a tag.
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: podtorrent-linux
          path: |
            app/src-tauri/target/release/bundle/appimage/*.AppImage
            app/src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error

      # The Linux desktop installer, the way a user runs it (sh is dash here): install, then update in place.
      - name: Install with install.sh (linux-x64-cuda)
        working-directory: ${{ github.workspace }}
        run: |
          f="$(ls "$PWD"/app/src-tauri/target/release/bundle/appimage/*.AppImage)"
          PODTORRENT_FILE="$f" sh install/install.sh --build linux-x64-cuda
          PODTORRENT_FILE="$f" sh install/install.sh --build linux-x64-cuda
          d="$HOME/.local/share/podtorrent/desktop"
          test -x "$d/PodTorrent.AppImage" && test -f "$d/PodTorrent.AppImage.old"
          test "$(cat "$d/BUILD")" = linux-x64-cuda
          test "$(readlink "$HOME/.local/bin/podtorrent-desktop")" = "$d/PodTorrent.AppImage"
          grep -qF "Exec=\"$d/PodTorrent.AppImage\"" "$HOME/.local/share/applications/podtorrent.desktop"
          test -s "$HOME/.local/share/icons/podtorrent.png"
          "$d/PodTorrent.AppImage" --appimage-version

      # On a v* tag (or a manual run that asks for it), upload the AppImage to R2 and make it the latest at
      # podtorrent.com/download/linux-x64-cuda, as podtorrent-<version>-linux-x64-cuda.AppImage.
      - if: (startsWith(github.ref, 'refs/tags/v') || inputs.publish)
        working-directory: release
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npm ci
          node publish.js linux-x64-cuda ../app/src-tauri/target/release/bundle/appimage/*.AppImage
