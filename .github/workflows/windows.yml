# Build the Windows installer (PodTorrent_<version>_x64-setup.exe) on a Windows runner.
# Unsigned for now: first run on a new PC shows SmartScreen's "More info -> Run anyway".
name: Windows build

on:
  push:
    branches: [main, windows-app]
    tags: ['v*']
    # Build only when something that goes into the installer changes, or this workflow itself: not for the
    # downloads site, docs, tests, iOS, the rendezvous, or another platform's workflow.
    # Tag pushes always build (GitHub skips path filters for tags).
    paths: ['app/**', 'podtorrent/**', 'pyproject.toml', 'uv.lock', '.python-version', 'install/**', '.github/workflows/windows.yml']
  pull_request:
    paths: ['app/**', 'podtorrent/**', 'pyproject.toml', 'uv.lock', '.python-version', 'install/**', '.github/workflows/windows.yml']
  workflow_dispatch:

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri

      # uv.exe is bundled into the installer; it installs Python and CUDA PyTorch on first launch.
      - uses: astral-sh/setup-uv@v6

      - run: npm ci

      # The network agent the app bundles (bundle-backend.js stages PODTORRENT_AGENT_BIN): the latest
      # released one, or the one in the repo variable PODTORRENT_AGENT_VERSION (e.g. v0.5.0). Without it the
      # app runs swarm-only and its Network page says "Agent missing".
      - name: Download podtorrent-agent
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ vars.PODTORRENT_AGENT_VERSION }}"
          gh release download $tag -R podtorrent/podtorrent-agent -p 'podtorrent-agent-v*-windows-amd64.exe' -p SHA256SUMS -D agent
          (cd agent && sha256sum -c --ignore-missing SHA256SUMS)
          echo "PODTORRENT_AGENT_BIN=$(cygpath -w "$(ls "$PWD"/agent/podtorrent-agent-v*-windows-amd64.exe)")" >> "$GITHUB_ENV"

      # The servers official builds talk to (podtorrent/endpoints.py), from the PODTORRENT_ENDPOINTS secret.
      # A fork sets its own, or builds without servers; a release tag must have one.
      - name: Write endpoints.json
        shell: bash
        env:
          ENDPOINTS: ${{ secrets.PODTORRENT_ENDPOINTS }}
        run: |
          if [ -n "$ENDPOINTS" ]; then printf '%s' "$ENDPOINTS" > "$GITHUB_WORKSPACE/podtorrent/endpoints.json"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then echo "::error::the PODTORRENT_ENDPOINTS secret is not set"; exit 1
          else echo "::warning::no PODTORRENT_ENDPOINTS secret: this build has no servers"; fi

      # Not `npm run build`: that bumps the version in tauri.conf.json, which CI shouldn't do.
      - run: node scripts/bundle-backend.js

      - run: npx tauri build --bundles nsis

      # Don't let a full artifact quota stop the build, or the R2 publish below on a tag.
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: podtorrent-windows-setup
          path: app/src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error

      # The Windows installer script, the way a user runs it: a silent per-user install, then an update.
      - name: Install with install.ps1
        working-directory: ${{ github.workspace }}
        shell: pwsh
        run: |
          $env:PODTORRENT_FILE = (Resolve-Path app/src-tauri/target/release/bundle/nsis/*-setup.exe).Path
          ./install/install.ps1
          ./install/install.ps1
          $app = Get-ChildItem "$env:LOCALAPPDATA\PodTorrent" -Filter *.exe | Where-Object { $_.Name -notmatch '^uninstall' }
          if (-not $app) { throw "install.ps1 didn't install PodTorrent in $env:LOCALAPPDATA\PodTorrent" }
          $app | ForEach-Object { "$($_.FullName) $($_.VersionInfo.ProductVersion)" }

      # On a v* tag, upload the installer to R2 and make it the latest at podtorrent.com/download/windows-x64-cuda,
      # as podtorrent-<version>-windows-x64-cuda.exe.
      - if: startsWith(github.ref, 'refs/tags/v')
        working-directory: downloads
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npm ci
          node scripts/publish.js windows-x64-cuda ../app/src-tauri/target/release/bundle/nsis/*-setup.exe
