# Linux build for AMD Ryzen AI Max / "Strix Halo" machines (Radeon 8060S, gfx1151): the same AppImage and .deb,
# but first launch installs ROCm PyTorch instead of CUDA. On a v* tag the AppImage is published as its own
# download (podtorrent.com/download/linux-amd); the plain Linux download stays the CUDA build.
# The user needs a recent kernel (6.14+) with amdgpu, and to be in the video and render groups.
name: Linux AMD build

on:
  push:
    branches: [main]
    tags: ['v*']
    # Build only when something that goes into the installer changes, or this workflow itself: not for the
    # downloads site, docs, tests, iOS, the rendezvous, or another platform's workflow.
    # Tag pushes always build (GitHub skips path filters for tags).
    paths: ['app/**', 'podtorrent/**', 'pyproject.toml', 'uv.lock', '.python-version', 'headless/**', 'install/**', '.github/workflows/linux-amd.yml']
  pull_request:
    paths: ['app/**', 'podtorrent/**', 'pyproject.toml', 'uv.lock', '.python-version', 'headless/**', 'install/**', '.github/workflows/linux-amd.yml']
  # A manual run with "publish" ticked uploads the build like a tag does: for a release whose tag build
  # failed, or when the artifact quota is full and there is nothing to download and publish by hand.
  workflow_dispatch:
    inputs:
      publish:
        description: Publish this build to the download page
        type: boolean
        default: false

concurrency:
  group: linux-amd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      # One build per AMD GPU family: each has its own PyTorch wheels. To support another family, add a row
      # with the index AMD publishes for it. The repo variable ROCM_TORCH_INDEX overrides every row if AMD moves
      # its indexes.
      matrix:
        include:
          - target: gfx1151  # Ryzen AI Max / Max+ / Max PRO 4xx (Radeon 8050S/8060S/8065S)
            index: https://repo.amd.com/rocm/whl/gfx1151/
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      # The runner's DNS has at times failed to resolve the Ubuntu package mirrors, which left this step
      # retrying until the 6-hour job limit. If it can't resolve them, use public resolvers for this job;
      # apt also gives up on a slow mirror after 30 s, and the step is capped.
      - timeout-minutes: 10
        run: |
          if ! getent hosts azure.archive.ubuntu.com archive.ubuntu.com >/dev/null; then
            echo "::warning::The runner's DNS can't resolve the Ubuntu mirrors; using public resolvers"
            sudo resolvectl dns "$(ip -o route get 1.1.1.1 | sed -n 's/.* dev \([^ ]*\).*/\1/p')" 1.1.1.1 8.8.8.8
            sudo resolvectl flush-caches
            getent hosts azure.archive.ubuntu.com archive.ubuntu.com
          fi
          apt="sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o DPkg::Lock::Timeout=120"
          $apt update
          $apt install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri

      # uv is bundled into the app; it installs Python and ROCm PyTorch on first launch.
      - uses: astral-sh/setup-uv@v6

      - run: npm ci

      # Not `npm run build`: that bumps the version in tauri.conf.json, which CI shouldn't do.
      - run: node scripts/bundle-backend.js
        env:
          PODTORRENT_TORCH_INDEX: ${{ vars.ROCM_TORCH_INDEX || matrix.index }}

      - run: npx tauri build --bundles appimage,deb

      # Don't let a full artifact quota stop the build, or the R2 publish below on a tag.
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: podtorrent-linux-amd-${{ matrix.target }}
          path: |
            app/src-tauri/target/release/bundle/appimage/*.AppImage
            app/src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error

      # The Linux desktop installer, the way a user runs it (sh is dash here): install, then update in place.
      - if: matrix.target == 'gfx1151'
        name: Install with install.sh (linux-x64-rocm)
        working-directory: ${{ github.workspace }}
        run: |
          f="$(ls "$PWD"/app/src-tauri/target/release/bundle/appimage/*.AppImage)"
          PODTORRENT_FILE="$f" sh install/install.sh --build linux-x64-rocm
          PODTORRENT_FILE="$f" sh install/install.sh --build linux-x64-rocm
          d="$HOME/.local/share/podtorrent/desktop"
          test -x "$d/PodTorrent.AppImage" && test -f "$d/PodTorrent.AppImage.old"
          test "$(cat "$d/BUILD")" = linux-x64-rocm
          test "$(readlink "$HOME/.local/bin/podtorrent-desktop")" = "$d/PodTorrent.AppImage"
          grep -qF "Exec=\"$d/PodTorrent.AppImage\"" "$HOME/.local/share/applications/podtorrent.desktop"
          test -s "$HOME/.local/share/icons/podtorrent.png"
          "$d/PodTorrent.AppImage" --appimage-version

      # On a v* tag (or a manual run that asks for it), upload the AppImage to R2 and make it the latest at
      # podtorrent.com/download/linux-x64-rocm; publish.js stores it as podtorrent-<version>-linux-x64-rocm.AppImage
      # (Tauri names it like the CUDA build). The page has one AMD download, so only the gfx1151 row publishes.
      - if: (startsWith(github.ref, 'refs/tags/v') || inputs.publish) && matrix.target == 'gfx1151'
        working-directory: downloads
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npm ci
          node scripts/publish.js linux-x64-rocm ../app/src-tauri/target/release/bundle/appimage/*.AppImage

  # The headless build for an SSH-only machine: a tarball with uv, the backend locked to ROCm PyTorch
  # (gfx1151), podtorrent-agent and the `podtorrent` launcher. No Tauri or GTK. On a v* tag (or a manual run
  # that asks for it) it is uploaded to this repo's GitHub release for the tag.
  headless:
    runs-on: ubuntu-22.04
    # The end-to-end test (tags and manual runs) installs ROCm PyTorch and runs a model on the CPU.
    timeout-minutes: 90
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: astral-sh/setup-uv@v6

      # The latest released agent, or the one in the repo variable PODTORRENT_AGENT_VERSION (e.g. v0.5.0).
      - name: Download podtorrent-agent
        run: |
          tag="${{ vars.PODTORRENT_AGENT_VERSION }}"
          gh release download $tag -R Munerate/podtorrent-agent -p 'podtorrent-agent-v*-linux-amd64' -p SHA256SUMS -D agent
          (cd agent && sha256sum -c --ignore-missing SHA256SUMS)
          echo "PODTORRENT_AGENT_BIN=$(ls "$PWD"/agent/podtorrent-agent-v*-linux-amd64)" >> "$GITHUB_ENV"

      - name: Build tarball
        env:
          PODTORRENT_TORCH_INDEX: ${{ vars.ROCM_TORCH_INDEX || 'https://repo.amd.com/rocm/whl/gfx1151/' }}
        run: |
          [[ "$GITHUB_REF" == refs/tags/v* ]] && export VERSION="${GITHUB_REF_NAME#v}"
          headless/package.sh dist
          tar -tzf dist/*.tar.gz | sort

      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: podtorrent-linux-x64-rocm-headless
          path: dist/*.tar.gz
          if-no-files-found: error

      # Before anything is published: the tarball end to end on this runner, as a user would run it, with
      # the GPU as the only thing missing (headless/e2e.sh). A failure here stops the publish steps below.
      - if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        name: Free disk for the end-to-end test
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /

      - if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        name: End-to-end test (no GPU)
        # Installed the way a user does it (install.sh under sh, which is dash here), twice so the
        # update path runs too, then tested through the `podtorrent` command it puts on PATH.
        run: |
          tarball="$(ls "$PWD"/dist/*.tar.gz)"
          PODTORRENT_FILE="$tarball" sh install/install.sh --headless
          PODTORRENT_FILE="$tarball" sh install/install.sh --headless
          test -d "$HOME/.local/share/podtorrent/app.old"
          export PATH="$HOME/.local/bin:$PATH"
          headless/e2e.sh "$HOME/.local/share/podtorrent/app"

      # The repo is private, so the client downloads from podtorrent.com/download/linux-x64-rocm-headless (R2), like the AppImage.
      - if: startsWith(github.ref, 'refs/tags/v') || inputs.publish
        name: Publish to the download page
        working-directory: downloads
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npm ci
          node scripts/publish.js linux-x64-rocm-headless ../dist/*.tar.gz

      - if: startsWith(github.ref, 'refs/tags/v') || inputs.publish
        name: Upload to the GitHub release
        run: |
          tag="$GITHUB_REF_NAME"
          [[ "$GITHUB_REF" == refs/tags/v* ]] || tag="v$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml | head -n1)"
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --verify-tag --title "$tag" --notes ""
          gh release upload "$tag" dist/*.tar.gz --clobber
