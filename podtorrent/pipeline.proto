syntax = "proto3";
package podtorrent;

// Carried over QUIC (podtorrent/net/quic.py): length-prefixed protobuf, one stream per call.
service Pipeline {
  // One long-lived stream per (session, hop); requests are processed in order.
  rpc Forward(stream ForwardRequest) returns (stream ForwardResponse);
  rpc Heartbeat(HeartbeatRequest) returns (HeartbeatReply);
  rpc Info(InfoRequest) returns (NodeInfo);
  // Fetch + load a layer range; streams progress until phase == ready|error.
  rpc Load(LoadRequest) returns (stream LoadProgress);
}

message ForwardRequest {
  string session_id = 1;
  bytes hidden = 2;          // fp16, shape [1, seq, hidden]
  repeated int32 shape = 3;
  bool release = 4;          // drop this session's KV cache (hidden empty)
  string model = 5;          // repo, e.g. mlx-community/Qwen3-30B-A3B-4bit
  int32 layer_lo = 6;        // run layers [layer_lo, layer_hi): any range inside a served slice
  int32 layer_hi = 7;
}

message ForwardResponse {
  string session_id = 1;
  bytes hidden = 2;
  repeated int32 shape = 3;
  float compute_ms = 4;      // local compute time on the serving peer
  string error = 5;          // set instead of hidden when this peer can't run the request
}

message HeartbeatRequest { int64 sent_ns = 1; }
message HeartbeatReply { int64 sent_ns = 1; }
message InfoRequest {}
message NodeInfo {
  string name = 1;
  int32 layer_lo = 2;
  int32 layer_hi = 3;
  float mem_active_gb = 4;
  float mem_peak_gb = 5;
  float mem_total_gb = 6;
  bool loaded = 7;
  int64 requests_served = 8;
  int64 tokens_processed = 9;  // sequence positions run through this node's layers
  int32 active_requests = 10;  // open KV caches
  bool busy = 11;              // a forward pass is running right now
  repeated Slice slices = 12;
  float mem_free_gb = 13;      // room left for more slices (Metal working-set budget minus active)
}

message Slice {
  string model = 1;
  int32 lo = 2;
  int32 hi = 3;
  bool loaded = 4;
  int32 n_layers = 5;          // the model's total layer count, for coverage
}

message LoadRequest {
  string repo = 1;
  int32 layer_lo = 2;
  int32 layer_hi = 3;
}

message LoadProgress {
  string phase = 1;          // downloading | loading | ready | error
  int64 done = 2;
  int64 total = 3;
  string message = 4;
}
