syntax = "proto3";
package podtorrent;

// Carried over QUIC (podtorrent/net/quic.py): length-prefixed protobuf, one stream per call.
service Pipeline {
  // One long-lived stream per (session, hop); requests are processed in order.
  rpc Forward(stream ForwardRequest) returns (stream ForwardResponse);
  rpc Heartbeat(HeartbeatRequest) returns (HeartbeatReply);
  rpc Info(InfoRequest) returns (NodeInfo);
  // Fetch + load a layer range; streams progress until phase == ready|error.
  rpc Load(LoadRequest) returns (stream LoadProgress);
  // Run one stage of a video job (encode layers, or render); streams JobEvents until done|failed.
  rpc VideoStage(VideoJob) returns (stream JobEvent);
  // Pull a blob from offset: the holder streams BlobChunks, the puller acks to keep a window open.
  rpc Blob(stream BlobAck) returns (stream BlobChunk);
}

message ForwardRequest {
  string session_id = 1;
  bytes hidden = 2;          // fp16, shape [1, seq, hidden]
  repeated int32 shape = 3;
  bool release = 4;          // drop this session's KV cache (hidden empty)
  string model = 5;          // repo, e.g. mlx-community/Qwen3-30B-A3B-4bit
  int32 layer_lo = 6;        // run layers [layer_lo, layer_hi): any range inside a served slice
  int32 layer_hi = 7;
}

message ForwardResponse {
  string session_id = 1;
  bytes hidden = 2;
  repeated int32 shape = 3;
  float compute_ms = 4;      // local compute time on the serving peer
  string error = 5;          // set instead of hidden when this peer can't run the request
}

message HeartbeatRequest { int64 sent_ns = 1; }
message HeartbeatReply { int64 sent_ns = 1; }
message InfoRequest {}
message NodeInfo {
  string name = 1;
  int32 layer_lo = 2;
  int32 layer_hi = 3;
  float mem_active_gb = 4;
  float mem_peak_gb = 5;
  float mem_total_gb = 6;
  bool loaded = 7;
  int64 requests_served = 8;
  int64 tokens_processed = 9;  // sequence positions run through this node's layers
  int32 active_requests = 10;  // open KV caches
  bool busy = 11;              // a forward pass is running right now
  repeated Slice slices = 12;
  float mem_free_gb = 13;      // room left for more slices (Metal working-set budget minus active)
  repeated string roles = 14;  // video roles: h3-encoder:LO:HI, h3-video
}

message Slice {
  string model = 1;
  int32 lo = 2;
  int32 hi = 3;
  bool loaded = 4;
  int32 n_layers = 5;          // the model's total layer count, for coverage
}

message LoadRequest {
  string repo = 1;
  int32 layer_lo = 2;
  int32 layer_hi = 3;
}

message LoadProgress {
  string phase = 1;          // downloading | loading | ready | error
  int64 done = 2;
  int64 total = 3;
  string message = 4;
}

// ---- video (docs/VIDEO_PLAN.md, phase 2) ----

// A blob another peer holds: pull it with the Blob RPC.
message BlobRef {
  string sha256 = 1;         // hex; also the blob's id
  int64 size = 2;
  string holder = 3;         // peer_id that has it
  string kind = 4;           // hidden | mp4 | image
  repeated int32 shape = 5;  // for hidden states: float32 [1, T, H]
}

// One input part. v1: text only; images arrive as a blob (phase 6).
message InputPart {
  string type = 1;           // text | image
  string text = 2;
  BlobRef blob = 3;
}

// One stage of a job, sent by the requester to the peer that runs it.
message VideoJob {
  string job_id = 1;
  string stage = 2;          // encode | render
  repeated InputPart inputs = 3;
  int32 width = 4;
  int32 height = 5;
  float seconds = 6;
  int32 frames = 7;
  int64 seed = 8;
  int32 steps = 9;
  string mode = 10;
  int32 layer_lo = 11;       // encode: run encoder layers [layer_lo, layer_hi)
  int32 layer_hi = 12;
  BlobRef input = 13;        // encode with layer_lo > 0: previous hidden state; render: final hidden state
  bool cancel = 14;          // sent on the open stream to stop the stage
}

message JobEvent {
  string job_id = 1;
  string state = 2;          // encoding | generating | decoding | done | failed | cancelled
  string detail = 3;
  int32 step = 4;
  int32 steps = 5;
  string error = 6;
  BlobRef output = 7;        // set with state == done
  float seconds = 8;         // stage compute time
}

message BlobAck {
  string sha256 = 1;
  int64 offset = 2;          // first: where to start (resume); then: bytes received so far
}

message BlobChunk {
  string sha256 = 1;
  int64 offset = 2;
  bytes data = 3;
  int64 size = 4;            // total size
  string error = 5;          // set when the holder doesn't have the blob
}
